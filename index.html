<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Запись на вождение</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div>
          <p class="eyebrow">DriveBook</p>
          <strong>Онлайн-запись</strong>
        </div>
        <nav class="view-switch" aria-label="Разделы приложения">
          <button class="active" type="button" data-view="booking">Запись</button>
          <button type="button" data-view="admin">Журнал</button>
        </nav>
      </header>

      <section class="booking-board" id="bookingView" aria-labelledby="page-title">
        <div class="visual-panel" aria-label="Учебный автомобиль">
          <img src="assets/driving-header.png" alt="Салон учебного автомобиля" />
          <div class="visual-overlay">
            <p class="kicker">Автошкола</p>
            <h1 id="page-title">Запись на занятие по вождению</h1>
            <p>Выберите свободное время, оставьте контакты, и инструктор увидит заявку в журнале.</p>
          </div>
        </div>

        <div class="content-grid">
          <section class="scheduler" aria-labelledby="schedule-title">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Шаг 1</p>
                <h2 id="schedule-title">Свободное время</h2>
              </div>
              <div class="legend" aria-label="Обозначения">
                <span><i class="dot available"></i>свободно</span>
                <span><i class="dot booked"></i>занято</span>
              </div>
            </div>
            <div class="day-tabs" id="dayTabs" role="tablist" aria-label="Дни занятий"></div>
            <div class="slot-grid" id="slotGrid" aria-live="polite"></div>
          </section>

          <aside class="form-panel" aria-labelledby="form-title">
            <div class="section-heading compact">
              <div>
                <p class="eyebrow">Шаг 2</p>
                <h2 id="form-title">Данные ученика</h2>
              </div>
            </div>

            <form id="bookingForm">
              <div class="selected-slot" id="selectedSlot">
                Выберите дату и время
              </div>

              <label>
                Имя ученика
                <input id="studentName" name="studentName" autocomplete="name" required placeholder="Например, Анна" />
              </label>

              <label>
                Телефон
                <input id="phone" name="phone" autocomplete="tel" inputmode="tel" required placeholder="+7 900 000-00-00" />
              </label>

              <label>
                Email
                <input id="email" name="email" autocomplete="email" inputmode="email" type="email" placeholder="name@example.com" />
              </label>

              <label>
                Инструктор
                <select id="instructor" name="instructor">
                  <option value="Марина Соколова">Марина Соколова</option>
                  <option value="Любой свободный инструктор">Любой свободный инструктор</option>
                  <option value="Алексей Волков">Алексей Волков</option>
                </select>
              </label>

              <label>
                Комментарий
                <textarea id="comment" name="comment" rows="3" placeholder="Опыт, район, пожелания"></textarea>
              </label>

              <label class="check-row">
                <input id="mailing" name="mailing" type="checkbox" />
                <span>Можно присылать напоминания и новости на email</span>
              </label>

              <button class="primary-action" type="submit">Записаться</button>
              <p class="form-note" id="formNote" role="status"></p>
            </form>
          </aside>
        </div>
      </section>

      <section class="admin-panel" id="adminView" aria-labelledby="admin-title" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Журнал</p>
            <h2 id="admin-title">Заявки</h2>
          </div>
          <div class="admin-actions">
            <button id="exportCsv" type="button">Экспорт CSV</button>
            <button id="clearDemo" type="button">Очистить</button>
          </div>
        </div>
        <div class="booking-list" id="bookingList"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
